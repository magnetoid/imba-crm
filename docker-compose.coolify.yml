services:
  imba-crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://crm.imbaproduction.com
      - PUBLIC_URL=https://crm.imbaproduction.com
      # Coolify automatically injects these if you link a database
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  imba-crm-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agencycrm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coolifypassword}
      - POSTGRES_DB=${POSTGRES_DB:-agencycrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agencycrm}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  imba-crm-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-coolifypassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-coolifypassword}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  redis_data:
