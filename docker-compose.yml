services:
  imba-crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-https://crm.imbaproduction.com}
      - PUBLIC_URL=${PUBLIC_URL:-https://crm.imbaproduction.com}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - '127.0.0.1:${APP_PORT:-3100}:80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  imba-crm-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agencycrm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-coolifypassword}
      - POSTGRES_DB=${POSTGRES_DB:-agencycrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agencycrm}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  imba-crm-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-coolifypassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-coolifypassword}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
