version: '3.9'

# ─────────────────────────────────────────────────────────────
#  imba-crm — Coolify project "Imba CRM"
#
#  ONLY the CRM SPA. Supabase is provided by the separate
#  standalone "Supabase Postgres" Coolify resource (postgres 17)
#  + (when re-introduced) standalone GoTrue/Kong/Storage. We
#  intentionally do NOT bring up our own postgres in this
#  compose — the previous setup tried to mount the existing
#  pg17 volume into a pg15 container, which crashes on every
#  startup (data dir version mismatch).
#
#  Coolify maps the imba-crm service to crm.imbaproduction.com
#  via the application's docker_compose_domains.
# ─────────────────────────────────────────────────────────────

services:

  imba-crm:
    build:
      context: .
      dockerfile: packages/crm/Dockerfile
      args:
        VITE_SUPABASE_URL: ${CRM_URL:-https://crm.imbaproduction.com}/supabase
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-super-secret-anon-key}
        VITE_APP_URL: ${CRM_URL:-https://crm.imbaproduction.com}
    container_name: imba-crm
    # Plesk's vhost for crm.imbaproduction.com proxies to this port
    # (see /var/www/vhosts/system/crm.imbaproduction.com/conf/vhost_nginx.conf
    # on tetra.imbamarketing.com). 9103 was already taken by the
    # imbaproduction-web-app PostgREST container, hence 9108.
    ports:
      - '127.0.0.1:9108:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
