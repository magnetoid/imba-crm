version: '3.9'

# ─────────────────────────────────────────────────────────────
#  imba-crm — Coolify project "Imba CRM"
#  Deploys the CRM SPA + its Supabase stack. Coolify wires
#  domains through its UI (docker_compose_domains), so we don't
#  add Traefik labels manually — service names below are what
#  Coolify maps to public hostnames.
#
#  The marketing site (imbaproduction.com) and Imba Marketing
#  (imbamarketing.com) are separate Coolify projects deployed
#  from different repos — do NOT add them here.
# ─────────────────────────────────────────────────────────────

networks:
  crm-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:

services:

  # ── CRM SPA (crm.imbaproduction.com) ──────────────────────
  imba-crm:
    build:
      context: .
      dockerfile: packages/crm/Dockerfile
      args:
        VITE_SUPABASE_URL: ${CRM_URL:-https://crm.imbaproduction.com}/supabase
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-super-secret-anon-key}
        VITE_APP_URL: ${CRM_URL:-https://crm.imbaproduction.com}
    container_name: imba-crm
    expose:
      - '80'
    networks:
      - crm-net
    depends_on:
      - supabase-kong
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Redis (rate limiting / sessions for Edge Functions) ───
  supabase-redis:
    image: redis:7-alpine
    container_name: supabase-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-coolifypassword}
    volumes:
      - redis_data:/data
    networks:
      - crm-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-coolifypassword}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Supabase: Postgres ────────────────────────────────────
  # supabase-db-perms fixes the volume ownership before postgres
  # starts. supabase/postgres runs as uid 999; if the volume gets
  # recreated by Coolify it ends up owned by root and pg fails to
  # write its lockfile, so pg_isready never returns ready.
  supabase-db-perms:
    image: alpine:3.20
    container_name: supabase-db-perms
    restart: 'no'
    user: '0:0'
    command: ['sh', '-c', 'chown -R 999:999 /var/lib/postgresql/data || true']
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-net

  supabase-db:
    image: 'supabase/postgres:15.1.0.147'
    container_name: supabase-db
    depends_on:
      supabase-db-perms:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
      POSTGRES_USER: '${POSTGRES_USER:-supabase}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-coolifypassword}'
      JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    networks:
      - crm-net
    healthcheck:
      # Check the postmaster is accepting connections. Don't pass -U/-d
      # because the role/db that lives in PGDATA may have been initdb'd
      # with different env (e.g. POSTGRES_USER=agencycrm vs supabase),
      # and pg_isready returns non-zero if the role doesn't exist even
      # though the server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  supabase-rest:
    image: 'postgrest/postgrest:v12.0.2'
    container_name: supabase-rest
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      PGRST_DB_URI: 'postgres://${POSTGRES_USER:-supabase}:${POSTGRES_PASSWORD:-coolifypassword}@supabase-db:5432/${POSTGRES_DB:-postgres}'
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      PGRST_APP_SETTINGS_JWT_EXP: '${JWT_EXPIRY:-3600}'
    restart: unless-stopped

  supabase-auth:
    image: 'supabase/gotrue:v2.143.0'
    container_name: supabase-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # Both apps share the same auth server; allow redirects to both domains.
      API_EXTERNAL_URL: '${CRM_URL:-https://crm.imbaproduction.com}/supabase'
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: 'postgres://${POSTGRES_USER:-supabase}:${POSTGRES_PASSWORD:-coolifypassword}@supabase-db:5432/${POSTGRES_DB:-postgres}?search_path=auth'
      GOTRUE_SITE_URL: '${CRM_URL:-https://crm.imbaproduction.com}'
      GOTRUE_URI_ALLOW_LIST: '${MARKETING_URL:-https://imbaproduction.com},${CRM_URL:-https://crm.imbaproduction.com}'
      GOTRUE_DISABLE_SIGNUP: '${DISABLE_SIGNUP:-false}'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '${JWT_EXPIRY:-3600}'
      GOTRUE_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    restart: unless-stopped

  supabase-storage:
    image: 'supabase/storage-api:v0.46.4'
    container_name: supabase-storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    networks:
      - crm-net
    volumes:
      - storage_data:/var/lib/storage
    environment:
      ANON_KEY: '${SUPABASE_ANON_KEY:-your-super-secret-anon-key}'
      SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-super-secret-service-key}'
      POSTGREST_URL: 'http://supabase-rest:3000'
      PGRST_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      DATABASE_URL: 'postgres://${POSTGRES_USER:-supabase}:${POSTGRES_PASSWORD:-coolifypassword}@supabase-db:5432/${POSTGRES_DB:-postgres}'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'true'
    restart: unless-stopped

  supabase-kong:
    image: 'kong:2.8.1'
    container_name: supabase-kong
    depends_on:
      - supabase-auth
      - supabase-rest
      - supabase-storage
    networks:
      - crm-net
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: 'LAST,A,CNAME'
      KONG_PLUGINS: 'request-transformer,cors,key-auth,acl,basic-auth'
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: '64 160k'
      SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY:-your-super-secret-anon-key}'
      SUPABASE_SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-super-secret-service-key}'
      DASHBOARD_USERNAME: '${DASHBOARD_USERNAME:-admin}'
      DASHBOARD_PASSWORD: '${DASHBOARD_PASSWORD:-changeme_dashboard}'
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - '127.0.0.1:${KONG_PORT:-8000}:8000'
    restart: unless-stopped

  supabase-meta:
    image: 'supabase/postgres-meta:v0.75.0'
    container_name: supabase-meta
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: '${POSTGRES_DB:-postgres}'
      PG_META_DB_USER: '${POSTGRES_USER:-supabase}'
      PG_META_DB_PASSWORD: '${POSTGRES_PASSWORD:-coolifypassword}'
    restart: unless-stopped

  supabase-studio:
    image: 'supabase/studio:20240101-8e4a094'
    container_name: supabase-studio
    depends_on:
      - supabase-kong
      - supabase-meta
    networks:
      - crm-net
    environment:
      STUDIO_PG_META_URL: 'http://supabase-meta:8080'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-coolifypassword}'
      DEFAULT_ORGANIZATION_NAME: 'Imba CRM'
      DEFAULT_PROJECT_NAME: 'imba-crm'
      SUPABASE_URL: 'http://supabase-kong:8000'
      SUPABASE_PUBLIC_URL: '${CRM_URL:-https://crm.imbaproduction.com}/supabase'
      SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY:-your-super-secret-anon-key}'
      SUPABASE_SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-super-secret-service-key}'
    ports:
      - '127.0.0.1:${STUDIO_PORT:-3000}:3000'
    restart: unless-stopped
