version: '3.9'

# ─────────────────────────────────────────────────────────────
#  imba-crm — Coolify project "Imba CRM"
#
#  Self-contained CRM stack:
#    crm.imbaproduction.com       → imba-crm SPA (port 9108)
#    crm.imbaproduction.com/supabase  → supabase-kong (internal, via SPA's nginx)
#
#  All host port bindings are on 127.0.0.1 because Plesk fronts SSL
#  and proxies down to localhost. The Plesk vhost for
#  crm.imbaproduction.com is configured to forward to :9108.
#
#  Volumes are namespaced 'crm_' to avoid colliding with the
#  imbaproduction-web-app stack (which has its own postgres-data,
#  redis-data, supabase-storage volumes for a different DB cluster).
# ─────────────────────────────────────────────────────────────

networks:
  crm-net:
    driver: bridge

volumes:
  crm_postgres_data:
  crm_redis_data:
  crm_storage_data:

services:

  # ── CRM SPA ───────────────────────────────────────────────
  imba-crm:
    build:
      context: .
      dockerfile: packages/crm/Dockerfile
      args:
        VITE_SUPABASE_URL: ${CRM_URL:-https://crm.imbaproduction.com}/supabase
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-super-secret-anon-key}
        VITE_APP_URL: ${CRM_URL:-https://crm.imbaproduction.com}
    container_name: imba-crm
    # Plesk's vhost for crm.imbaproduction.com proxies to this port.
    ports:
      - '127.0.0.1:9108:80'
    networks:
      - crm-net
    depends_on:
      - supabase-kong
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Postgres volume permissions fixer ─────────────────────
  supabase-db-perms:
    image: alpine:3.20
    container_name: imba-crm-db-perms
    restart: 'no'
    user: '0:0'
    command: ['sh', '-c', 'chown -R 999:999 /var/lib/postgresql/data || true']
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    networks:
      - crm-net

  supabase-db:
    image: 'supabase/postgres:15.1.0.147'
    container_name: imba-crm-db
    depends_on:
      supabase-db-perms:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-agencycrm}'
      POSTGRES_USER: '${POSTGRES_USER:-agencycrm}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-changeme_postgres}'
      JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
      # roles.sql ran BEFORE supabase's own migrate.sh and aborted init
      # because it tries to ALTER non-existent users (authenticator etc.).
      # Skip it — the supabase/postgres image creates and password-protects
      # those roles itself via JWT_SECRET.
    networks:
      - crm-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  supabase-redis:
    image: 'redis:7.2-alpine'
    container_name: imba-crm-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis} --appendonly yes
    volumes:
      - crm_redis_data:/data
    networks:
      - crm-net
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme_redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  supabase-rest:
    image: 'postgrest/postgrest:v12.0.2'
    container_name: imba-crm-rest
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      PGRST_DB_URI: 'postgres://${POSTGRES_USER:-agencycrm}:${POSTGRES_PASSWORD:-changeme_postgres}@supabase-db:5432/${POSTGRES_DB:-agencycrm}'
      PGRST_DB_SCHEMA: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      PGRST_APP_SETTINGS_JWT_EXP: '${JWT_EXPIRY:-3600}'
    restart: unless-stopped

  supabase-auth:
    image: 'supabase/gotrue:v2.143.0'
    container_name: imba-crm-auth
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: '${CRM_URL:-https://crm.imbaproduction.com}/supabase'
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: 'postgres://${POSTGRES_USER:-agencycrm}:${POSTGRES_PASSWORD:-changeme_postgres}@supabase-db:5432/${POSTGRES_DB:-agencycrm}?search_path=auth'
      GOTRUE_SITE_URL: '${CRM_URL:-https://crm.imbaproduction.com}'
      GOTRUE_URI_ALLOW_LIST: '${CRM_URL:-https://crm.imbaproduction.com}'
      GOTRUE_DISABLE_SIGNUP: '${DISABLE_SIGNUP:-true}'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '${JWT_EXPIRY:-3600}'
      GOTRUE_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    restart: unless-stopped

  supabase-storage:
    image: 'supabase/storage-api:v0.46.4'
    container_name: imba-crm-storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    networks:
      - crm-net
    volumes:
      - crm_storage_data:/var/lib/storage
    environment:
      ANON_KEY: '${SUPABASE_ANON_KEY:-your-anon-key}'
      SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-service-key}'
      POSTGREST_URL: 'http://supabase-rest:3000'
      PGRST_JWT_SECRET: '${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}'
      DATABASE_URL: 'postgres://${POSTGRES_USER:-agencycrm}:${POSTGRES_PASSWORD:-changeme_postgres}@supabase-db:5432/${POSTGRES_DB:-agencycrm}'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'true'
    restart: unless-stopped

  supabase-kong:
    image: 'kong:2.8.1'
    container_name: imba-crm-kong
    depends_on:
      - supabase-auth
      - supabase-rest
      - supabase-storage
    networks:
      - crm-net
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: 'LAST,A,CNAME'
      KONG_PLUGINS: 'request-transformer,cors,key-auth,acl,basic-auth'
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: '64 160k'
      SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY:-your-anon-key}'
      SUPABASE_SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-service-key}'
      DASHBOARD_USERNAME: '${DASHBOARD_USERNAME:-admin}'
      DASHBOARD_PASSWORD: '${DASHBOARD_PASSWORD:-changeme_dashboard}'
    volumes:
      # Coolify renders the compose to /artifacts/<deploy>/ and runs from
      # there, so a relative './supabase/kong.yml' resolves to a missing
      # path — Docker would then create a directory in its place. Use the
      # absolute clone path Coolify checked the repo out at.
      - /data/coolify/applications/gofuebf6cxfjglkgko187qph/supabase/kong.yml:/var/lib/kong/kong.yml:ro
    restart: unless-stopped

  supabase-meta:
    image: 'supabase/postgres-meta:v0.75.0'
    container_name: imba-crm-meta
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - crm-net
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: '${POSTGRES_DB:-agencycrm}'
      PG_META_DB_USER: '${POSTGRES_USER:-agencycrm}'
      PG_META_DB_PASSWORD: '${POSTGRES_PASSWORD:-changeme_postgres}'
    restart: unless-stopped

  supabase-studio:
    image: 'supabase/studio:20240101-8e4a094'
    container_name: imba-crm-studio
    depends_on:
      - supabase-kong
      - supabase-meta
    networks:
      - crm-net
    environment:
      STUDIO_PG_META_URL: 'http://supabase-meta:8080'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-changeme_postgres}'
      DEFAULT_ORGANIZATION_NAME: 'Imba CRM'
      DEFAULT_PROJECT_NAME: 'imba-crm'
      SUPABASE_URL: 'http://supabase-kong:8000'
      SUPABASE_PUBLIC_URL: 'https://crm-studio.imbaproduction.com'
      SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY:-your-anon-key}'
      SUPABASE_SERVICE_KEY: '${SUPABASE_SERVICE_KEY:-your-service-key}'
    # Plesk vhost crm-studio.imbaproduction.com proxies to this port.
    ports:
      - '127.0.0.1:9114:3000'
    restart: unless-stopped
