server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # CRM is a private workspace — keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Docker DNS — needed so /supabase and /yjs upstreams are resolved
    # at request time rather than at nginx startup. Without this,
    # nginx refuses to boot if the upstream hostnames don't exist
    # (the standalone Supabase resource isn't in this compose).
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Supabase API proxy → Kong on the shared docker network.
    # Use a regex location so we can strip the /supabase/ prefix when
    # constructing the upstream URI. nginx does NOT strip the location
    # prefix automatically when proxy_pass uses a variable.
    location ~ ^/supabase/(.*)$ {
        set $supabase_upstream supabase-kong:8000;
        proxy_pass http://$supabase_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Embeddable widget bootstrap ───────────────────────────────────
    # Single JS file that any host site can <script> in. Cache 5 min.
    location = /widget.js {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/widget.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Widget HTTP API (called from the embedded widget) ────────────
    location ~ ^/api/widget/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/widget/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Worker tracking endpoints (open-pixel, click-redirect) ────────
    # Public, no auth — these URLs land in outbound email bodies. The
    # worker writes opens/clicks into crm_email_events.
    location ~ ^/track/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/track/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Third-party webhooks (Cal.com bookings, future: Stripe etc.) ──
    # Public, signature-verified by the worker.
    location ~ ^/api/webhooks/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/webhooks/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Worker test-connection RPCs (admin-only via JWT) ──────────────
    # Authenticated by the worker itself against JWT_SECRET; the SPA
    # forwards the user's session token in Authorization: Bearer.
    location ~ ^/api/worker/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/worker/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── AI proxy (shared/lib/ai.callAI() POSTs here) ──────────────────
    # The SPA's callAI() helper hits /api/ai/route. The worker proxies
    # to the configured AI provider using server-side credentials.
    location ~ ^/api/ai/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/ai/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Inbox AI (Phase 12) ───────────────────────────────────────────
    # suggest / compose / rewrite endpoints.
    location ~ ^/api/inbox/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/inbox/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── MCP server (Model Context Protocol — JSON-RPC) ──────────────
    # External Claude Desktop / Cursor / claude-code clients connect
    # here to use imba-crm's Nomo tool registry as MCP tools.
    location ~ ^/api/mcp$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/mcp$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/\.well-known/mcp/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/.well-known/mcp/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Open Graph (link preview + shareable lead cards) ────────────
    # /api/og/fetch is JWT-gated (operator only). /og/lead/<id>* is
    # public so Slack/Twitter/Discord crawlers can read the meta tags.
    location ~ ^/api/og/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location ~ ^/og/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/og/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Site Analyzer (Phase 12.7) ────────────────────────────────────
    # Server-side HTML fetch so the analyzer feeds real content to AI.
    location ~ ^/api/site-analyzer/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/site-analyzer/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Nomo copilot (Phase 8) ────────────────────────────────────────
    # SSE streaming endpoint and CRUD for chat threads.
    location ~ ^/api/nomo/(.*)$ {
        set $worker_upstream inbox-puller:3030;
        proxy_pass http://$worker_upstream/api/nomo/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # keep SSE chunks live
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Yjs collaboration websocket (for CRM tiptap docs).
    location ~ ^/yjs/(.*)$ {
        set $yjs_upstream yjs:1234;
        proxy_pass http://$yjs_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
